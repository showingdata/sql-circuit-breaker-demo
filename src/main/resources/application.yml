server:
  port: 8089
spring:
  application:
    name: circuit-breaker-demo
  datasource:
    dynamic:
      # 默认主库名为master，这里表示默认使用slave_1作为主库
      primary: slave_1
      # 不使用严格模式
      strict: false
      datasource:
        master:
          url: jdbc:mysql://127.0.0.1:3306/circuit_breaker_demo
          username: root
          password: 123456
          driver-class-name: com.mysql.cj.jdbc.Driver
        slave_1:
          url: jdbc:mysql://127.0.0.1:3306/circuit_breaker_demo
          username: root
          password: 123456
          driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      # 启动时执行 schema.sql
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# -------------------------------------------------------
# 熔断器配置（刻意缩短时间，方便演示）
# -------------------------------------------------------
sql-circuit-breaker:
  validate-annotations-on-startup: true
  enabled: true
  select:
    # SELECT 超时阈值（毫秒），建议 10s
    timeout-ms: 1
    # 连续超时几次触发熔断，SELECT 建议 3
    failure-threshold: 1
    # 熔断持续时长（毫秒），建议 60s
    circuit-open-ms: 30000
    # 熔断状态缓存最大条目数（LRU 驱逐）
    cache-max-size: 5000
  insert:
    # DML 建议 5s
    timeout-ms: 5000
    # 连续超时几次触发熔断，INSERT 建议 1
    failure-threshold: 1
    # 熔断持续时长（毫秒），建议 30s
    circuit-open-ms: 30000
    # 熔断状态缓存最大条目数（LRU 驱逐）
    cache-max-size: 5000

  update:
    timeout-ms: 5000
    failure-threshold: 1
    circuit-open-ms: 30000
    cache-max-size: 5000

  delete:
    timeout-ms: 3000
    failure-threshold: 1
    circuit-open-ms: 30000
    cache-max-size: 5000

# -------------------------------------------------------
# Spring Boot Actuator / Prometheus 指标
# 访问地址：http://localhost:8089/actuator/prometheus
# -------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        descriptions: false
    enable:
      # 默认关闭所有 meter，只保留下面显式打开的应用级基础指标。
      all: false
      # JVM：内存 jvm_memory_* / 缓冲区 jvm_buffer_* / GC jvm_gc_* / 线程 jvm_threads_*
      jvm:
        memory: true
        buffer: true
        gc: true
        threads: true
      # 磁盘：disk_*
      disk: true
      # 进程：process_*
      process: true
      # 系统：system_*
      system: true
      # 线程池：executor_*
      executor: true
    tags:
      application: ${spring.application.name}
      env: ${APP_ENV:local}
      cluster: ${APP_CLUSTER:windows-local}

logging:
  file:
    path: ./logs
  level:
    org.mybatis.spring: INFO
    io.github.showingdata.sql.circuit.breaker: INFO


